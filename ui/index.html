<!doctype html>
<meta charset="utf-8">
<title>MSA_RogueWatch preview</title>
<style>
  body{margin:0;background:#071018;color:#d9f7ff;font:14px system-ui;display:grid;place-items:center;height:100vh}
  .screen{width:480px;height:320px;background:linear-gradient(145deg,#102b3b,#071018);border:3px solid #1de9ff;border-radius:18px;box-shadow:0 0 35px #00bcd466;padding:22px;box-sizing:border-box}
  h1{margin:0;color:#59f3ff;letter-spacing:3px;font-size:25px}.sub{color:#80aebb;margin:3px 0 18px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{border:1px solid #1d7182;border-radius:10px;padding:13px;background:#0a1b28}.big{font-size:28px;color:#fff}.ok{color:#50ffb0}.warn{color:#ffd166}.bar{height:7px;background:#173746;border-radius:9px;margin-top:9px}.bar i{display:block;width:68%;height:100%;background:#20e0ee;border-radius:9px}
  footer{margin-top:18px;color:#6f9aa8;font-size:12px}.actions{margin-top:14px;display:flex;gap:8px}.actions button{background:#123b4b;color:#d9f7ff;border:1px solid #22d7e8;border-radius:7px;padding:8px 12px;cursor:pointer}.status{color:#ffd166;margin-top:8px;font-size:12px}
</style>
<main class="screen"><h1>MSA_RogueWatch</h1><div class="sub">PASSIVE WIRELESS DEFENDER · v0.1</div>
<section class="grid"><div class="card"><div>RADAR</div><div id="radar" class="big ok">SCANNING</div><div id="radarInfo">2.4 GHz · 11 redes</div><div class="bar"><i id="bar"></i></div></div>
<div class="card"><div>ALERTAS</div><div id="alerts" class="big warn">0</div><div>sin actividad sospechosa</div></div>
<div class="card"><div>HUELLAS</div><div class="big">27</div><div>dispositivos observados</div></div>
<div class="card"><div>CONTROLES</div><div>BOOT: cambiar vista</div><div>BOOT 2s: pausar</div></div></section>
<div class="actions"><button id="connect">Conectar USB</button><button id="pause">Pausa / reanuda</button></div><div class="status" id="status">USB sin conectar</div>
<footer>interfaz serie Web Serial · pantalla ST7789 · sin táctil</footer></main>
<script>
let port,writer,reader,paused=false;
const status=document.querySelector('#status');
document.querySelector('#connect').onclick=async()=>{try{port=await navigator.serial.requestPort();await port.open({baudRate:115200});status.textContent='● USB conectado · ESP32 online';document.querySelector('#radarInfo').textContent='telemetría serie activa';document.querySelector('#bar').style.width='92%';reader=port.readable.getReader();const dec=new TextDecoder();let buf='';while(true){const {value,done}=await reader.read();if(done)break;buf+=dec.decode(value);let lines=buf.split(/\r?\n/);buf=lines.pop();for(const line of lines){if(line.includes('ROGUEWATCH_PAUSED=1')){paused=true;paint();}if(line.includes('ROGUEWATCH_PAUSED=0')){paused=false;paint();}if(line.includes('ROGUEWATCH'))status.textContent='● ESP32: '+line;}}}catch(e){status.textContent='No se pudo abrir el puerto: '+e.message;}};
function paint(){document.querySelector('#radar').textContent=paused?'PAUSED':'SCANNING';document.querySelector('#radar').className='big '+(paused?'warn':'ok');document.querySelector('#pause').textContent=paused?'Reanudar escaneo':'Pausa / reanuda';status.textContent=paused?'Ⅱ Escaneo pausado':'▶ Escaneo activo';}
document.querySelector('#pause').onclick=async()=>{if(!port?.writable){status.textContent='Conecta primero el USB';return}paused=!paused;paint();writer=port.writable.getWriter();await writer.write(new TextEncoder().encode('p\n'));writer.releaseLock();};
</script>
